{% extends "base.html" %}

{% block title %}System Error – OnionVision AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5 max-w-500 mx-auto">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3 class="fw-bold mb-3">Internal Processing Error</h3>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing the request. Please verify the uploaded image format or check server logs.
        </p>
        <a href="/inspect" class="btn btn-emerald rounded-pill px-4">
            <i class="bi bi-arrow-repeat me-1"></i> Retry Inspection
        </a>
    </div>
</div>
{% endblock %}
