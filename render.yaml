services:
  - type: web
    name: onionvision-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --timeout 120"
    plan: free
    envVars:
      - key: AI_MODE
        value: demo
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
